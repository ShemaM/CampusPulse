{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Event - CampusPulse Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }</style>
    <link rel="stylesheet" href="{% static 'api/admin.css' %}">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 max-w-md w-full text-center">
        <h1 class="text-xl font-bold text-[#0B2545] mb-2">Delete Event?</h1>
        <p class="text-sm text-slate-500 mb-6">Are you sure you want to delete <b>"{{ event.title }}"</b>? This action cannot be undone.</p>
        <form method="POST" class="flex space-x-3">
            {% csrf_token %}
            <a href="/api/dashboard/" class="flex-1 px-4 py-3 rounded-xl font-bold text-sm bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Cancel</a>
            <button type="submit" class="flex-1 px-4 py-3 rounded-xl font-bold text-sm bg-red-600 text-white hover:bg-red-700 transition">Yes, Delete</button>
        </form>
    </div>
</body>
</html>
